<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnMate プロトタイプ｜AI伴走型ラーニングプラットフォーム</title>
<style>
:root{color-scheme:light}
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 100% at 50% 0%,#f1f0ff 0%,#f6f6f4 55%,#efeeea 100%);
  font-family:"Inter","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;color:#12121a}
#gate .box{width:100%;max-width:390px;background:#fff;border:1px solid #e6e5e1;border-radius:16px;
  padding:30px 28px;box-shadow:0 1px 2px rgba(18,18,26,.05),0 18px 44px rgba(18,18,26,.09)}
#gate .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#a855f7);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
#gate h1{font-size:17px;margin:14px 0 5px;letter-spacing:-.3px}
#gate p{font-size:12.5px;line-height:1.65;color:#6b6b7b;margin:0 0 20px}
#gate label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a8a97;margin-bottom:6px}
#gate input{width:100%;border:1px solid #e0dfda;border-radius:10px;padding:11px 13px;font-size:14px;outline:none;
  background:#fdfdfc;transition:border-color .12s,box-shadow .12s}
#gate input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.14)}
#gate button{width:100%;margin-top:12px;background:#12121a;color:#fff;border:0;border-radius:10px;
  padding:11px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
#gate button:hover{opacity:.88}
#gate button:disabled{opacity:.5;cursor:progress}
#gate button:focus-visible,#gate input:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
#gate .err{font-size:12.5px;color:#d0402f;margin-top:10px;min-height:18px}
#gate .foot{font-size:11px;color:#9a9aa6;line-height:1.6;margin-top:18px;padding-top:14px;border-top:1px solid #efeeea}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="lg">L</div>
    <h1>LearnMate プロトタイプ</h1>
    <p>AI伴走型ラーニングプラットフォームの主要機能を再現した、閲覧用のモックです。パスワードを入力してください。</p>
    <form id="f">
      <label for="pw">パスワード</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button id="go" type="submit">開く</button>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
    </form>
    <div class="foot">機能検討用のプロトタイプです。LearnMate は実在しない仮称のサービスで、登場する人物・組織・数値・シグナルはすべて架空です。</div>
  </div>
</div>
